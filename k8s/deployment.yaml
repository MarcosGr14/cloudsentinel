apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudsentinel-waf
  labels:
    app: cloudsentinel-waf
spec:
  replicas: 2 # 2 instancias paralelas para Alta Disponibilidad
  selector:
    matchLabels:
      app: cloudsentinel-waf
  template:
    metadata:
      labels:
        app: cloudsentinel-waf
    spec:
      containers:
      - name: waf-container
        image: cloudsentinel:v1
        imagePullPolicy: IFNotPresent
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "500m"
            memory: "128Mi"
          requests:
            cpu: "100m"
            memory: "64Mi"
        env:
        - name: REDIS_ADDR
          value: "redis-sentinel:6379"
        - name: DB_CONN_STR
          value: "host=postgres-sentinel port=5432 user=postgres password=sentinelpass dbname=cloudsentinel_db sslmode=disable"
---
apiVersion: v1
kind: Service
metadata:
  name: cloudsentinel-service
spec:
  type: NodePort
  selector:
    app: cloudsentinel-waf
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
